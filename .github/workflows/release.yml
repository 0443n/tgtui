name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Bake credentials
        env:
          API_ID: ${{ secrets.TGTUI_API_ID }}
          API_HASH: ${{ secrets.TGTUI_API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "TGTUI_API_ID / TGTUI_API_HASH secrets are not set" >&2
            exit 1
          fi
          printf 'TGTUI_API_ID=%s\nTGTUI_API_HASH=%s\n' "$API_ID" "$API_HASH" > .env

      - run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath \
              -ldflags "-s -w -X github.com/0443n/tgtui/internal/tg.Version=${GITHUB_REF_NAME#v}" \
              -o "dist/tgtui-${target%/*}-${target#*/}" .
          done
          cd dist && sha256sum tgtui-* > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
