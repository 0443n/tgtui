name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # go:embed needs .env to exist; an empty one gives a non-baked build.
      - run: cp .env.example .env
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
